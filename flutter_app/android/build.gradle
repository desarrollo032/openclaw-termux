rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Provide flutter compilation defaults for plugins whose build.gradle
    // references flutter.compileSdkVersion before the Flutter tooling injects it.
    if (project.name != "app") {
        project.ext.set("flutter", [
            compileSdkVersion: 36,
            minSdkVersion: 29,
            targetSdkVersion: 36,
            ndkVersion: "27.0.12077973"
        ])
    }
}

// Ensure Kotlin JVM target matches Java compile target (17)
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlin")) {
            project.kotlin {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
