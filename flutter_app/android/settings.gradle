pluginManagement {
    def flutterSdkPath = {
        def properties
        properties = new Properties()

        file("local.properties").withInputStream {
            properties.load(it)
        }

        def sdkPath = properties.getProperty("flutter.sdk")

        assert sdkPath != null : "flutter.sdk not set in local.properties"

        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
     id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
        def flutterSdkPath = {
            def properties = new Properties()

            file("local.properties").withInputStream {
                properties.load(it)
            }

            def sdkPath = properties.getProperty("flutter.sdk")

            assert sdkPath != null : "flutter.sdk not set in local.properties"

            return sdkPath
        }()
        def flutterStorageBaseUrl = System.getenv("FLUTTER_STORAGE_BASE_URL") ?: "https://storage.googleapis.com"
        def engineRealmFile = file("${flutterSdkPath}/bin/cache/engine.realm")
        def engineRealm = engineRealmFile.exists() ? engineRealmFile.text.trim() : ""

        if (!engineRealm.isEmpty()) {
            engineRealm += "/"
        }

        def localEngineRepo = gradle.startParameter.projectProperties["local-engine-repo"]

        maven {
            url = uri(localEngineRepo ?: "${flutterStorageBaseUrl}/${engineRealm}download.flutter.io")
        }
        maven {
            url = uri("https://jitpack.io")
        }
        // Fallback for plugins that still reference jcenter() (#69).
        // usb_serial 0.5.x requires jcenter for dependency resolution.
        //noinspection GradleDeprecated
        jcenter()
    }
}

include ":app"
