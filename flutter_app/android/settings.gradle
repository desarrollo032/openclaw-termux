pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()

        file("local.properties").withInputStream {
            properties.load(it)
        }

        def sdkPath = properties.getProperty("flutter.sdk")

        assert sdkPath != null : "flutter.sdk not set in local.properties"

        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "com.android.library" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()

        def flutterSdkPath = {
            def properties = new Properties()

            file("local.properties").withInputStream {
                properties.load(it)
            }

            def sdkPath = properties.getProperty("flutter.sdk")

            assert sdkPath != null : "flutter.sdk not set in local.properties"

            return sdkPath
        }()

        def flutterStorageBaseUrl = System.getenv("FLUTTER_STORAGE_BASE_URL") ?: "https://storage.googleapis.com"
        def engineRealmFile = file("${flutterSdkPath}/bin/cache/engine.realm")
        def engineRealm = engineRealmFile.exists() ? engineRealmFile.text.trim() : ""

        if (!engineRealm.isEmpty()) {
            engineRealm += "/"
        }

        def localEngineRepo = gradle.startParameter.projectProperties["local-engine-repo"]

        maven {
            url = uri(localEngineRepo ?: "${flutterStorageBaseUrl}/${engineRealm}download.flutter.io")
        }

        maven {
            url = uri("https://jitpack.io")
        }
    }
}

include ":app"
